<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 400px;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
}

h1 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
    text-transform: capitalize;
}

#inputfield {
    width: 70%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    font-size: 15px;
}

#inputfield:focus {
    border-color: #4f46e5;
}

#btn {
    padding: 12px 14px;
    border: none;
    border-radius: 6px;
    background: #4f46e5;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

#btn:hover {
    background: #3730a3;
}

#parent {
    margin-top: 25px;
}

#parent div {
    background: #f1f5f9;
    padding: 12px 15px;
    margin-bottom: 10px;
    border-radius: 6px;
    color: #333;
}
    </style>
</head>
<body>
    <div class="container">
        <h1>simple todo app</h1>
        <input type="text" id="inputfield" placeholder="enter ur task">
        <button id="btn">add todo</button>
        <div id="parent"></div>
    </div>
    <script src="todo.js"></script>
</body>
</html>
